#
# FreePDK45 / Nangate 45nm open predictive PDK.
#
# GDS layer numbers and datatypes are taken verbatim from the FreePDK45
# KLayout layer-property file (FreePDK45.lyp). Metal "z" (layer bottom) and
# "height" (thickness) are read from the Nangate/FreePDK45 technology LEF
# (HEIGHT/THICKNESS); via heights are derived as the dielectric gap between
# the metal below and above. Well/active/poly/contact z-values are estimates
# for visualization (these are doping/masterslice layers with no LEF film).
#
# Sources:
#   FreePDK45.lyp  - github.com/The-OpenROAD-Project/OpenROAD-flow-scripts
#                    flow/platforms/nangate45/FreePDK45.lyp
#   tech LEF       - .../nangate45/lef/NangateOpenCellLibrary.tech.lef

# --- Front end of line (doping / poly) ----------------------------------
nwell:
  index: 3
  type: 0
  z: -0.30   # Estimated (doping region in substrate)
  height: 0.20
active:
  index: 1
  type: 0
  z: -0.15   # Estimated (diffusion)
  height: 0.15
poly:
  index: 9
  type: 0
  z: 0.0
  height: 0.10   # Estimated (no thickness in LEF)
contact:
  index: 10
  type: 0
  z: 0.0
  height: 0.37   # Fills substrate up to metal1 bottom

# --- Back end of line (metal / via stack, from tech LEF) ----------------
metal1:
  index: 11
  type: 0
  z: 0.37
  height: 0.13
via1:
  index: 12
  type: 0
  z: 0.50
  height: 0.12   # Derived gap
