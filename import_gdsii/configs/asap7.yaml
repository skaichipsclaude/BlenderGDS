#
# ASAP7 - ASU 7nm FinFET predictive PDK.
#
# GDS layer numbers and datatypes are taken verbatim from the ASAP7 KLayout
# layer-property file (asap7.lyp) and cross-checked against the ASAP7 paper
# mask IDs (Clark et al., Microelectronics Journal 2016). Datatype 0 = drawing.
#
# IMPORTANT - 4x scale: ASAP7 ships its GDS drawn at 4x the real silicon
# dimensions (an 18 nm M1 appears as 0.072 um in the file). Because the
# importer reads the lateral GDS coordinates as-is, the "z" and "height"
# values below are ALSO given in 4x space (real thickness x 4) so the 3D model
# stays proportionally correct. Real (1x) thicknesses are 1/4 of these.
#
# Metal pitches/widths are firm (tech LEF asap7_tech_1x_201209.lef); per-layer
# metal/via THICKNESS and absolute Z are not published and are engineering
# estimates (metal thickness ~ pitch, aspect ratio <= ~2). Treat z/height as
# relative proportions, not fab-accurate values.
#
# Sources:
#   asap7.lyp     - github.com/laurentc2/ASAP7_for_KLayout
#   tech LEF      - github.com/The-OpenROAD-Project/OpenROAD-flow-scripts
#                   flow/platforms/asap7/lef/asap7_tech_1x_201209.lef

# --- Front end of line --------------------------------------------------
